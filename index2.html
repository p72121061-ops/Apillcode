<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#10141c">
<title>Glass TV</title>
<style>
:root{--accent:#9dc9ff;--glass:rgba(255,255,255,.09);--line:rgba(255,255,255,.16)}
*{box-sizing:border-box}
body{margin:0;min-height:100vh;color:#f5f7fb;font-family:system-ui,sans-serif;cursor:none;background:radial-gradient(ellipse at 80% 15%,#344966 0,transparent 42%),radial-gradient(ellipse at 15% 85%,#35304f 0,transparent 45%),#10141c}
main{padding:5vh 6vw;max-width:1500px;margin:auto}
header{display:flex;justify-content:space-between;align-items:center;gap:16px;margin-bottom:8vh}
.logo{letter-spacing:3px;font-size:13px;color:var(--accent)}
.clock{color:#c2cad8}
h1{font-size:clamp(34px,6vw,68px);margin:10px 0}
p{color:#bdc6d5;line-height:1.6}
.panel,.tile{background:var(--glass);border:1px solid var(--line);border-radius:22px;backdrop-filter:blur(18px);-webkit-backdrop-filter:blur(18px)}
.hero{padding:clamp(22px,4vw,42px)}
.cards{display:flex;justify-content:space-between;gap:16px;margin-top:22px;flex-wrap:wrap}
.tile{flex:1 1 180px;min-height:145px;padding:22px;cursor:pointer;color:inherit;text-align:left;font:inherit;transition:transform .18s,border-color .18s}
.tile small{display:block;color:#bdc6d5;margin-top:10px}
button:focus-visible,a:focus-visible{outline:3px solid var(--accent);outline-offset:4px}
.tile:focus,.tile:focus-visible,.actions button:focus,.actions button:focus-visible{outline:3px solid var(--accent);outline-offset:5px;border-color:var(--accent);box-shadow:0 0 0 5px rgba(157,201,255,.12);transform:translateY(-2px)}
button{cursor:none}
.actions{display:flex;flex-wrap:wrap;gap:12px;margin-top:22px}
.actions button{background:var(--glass);color:white;border:1px solid var(--line);border-radius:30px;padding:12px 18px;cursor:pointer}
#message{min-height:28px;margin-top:20px}
footer{margin-top:38px;font-size:12px;color:#aeb8c8}
@media(max-width:600px){main{padding:24px 18px}header{margin-bottom:40px}.tile{flex-basis:100%}}
</style>
</head>
<body>
<main>
<header><div class="logo">GLASS / TV</div><div class="clock" id="clock">YOUR SPACE</div></header>
<section class="panel hero">
<p>YOUR PERSONAL SCREEN</p><h1>Make yourself<br>at home.</h1>
<p>A quieter, more personal space for your TV.</p>
<div class="actions"><button id="explore">Explore library</button><button id="wallpaper">Change atmosphere</button></div>
</section>
<section class="cards" aria-label="TV sections">
<button class="tile" data-section="Library">◫ <h2>Library</h2><small>Your watchlist and favourites</small></button>
<button class="tile" data-section="Discover">◈ <h2>Discover</h2><small>Your saved websites</small></button>
<button class="tile" data-section="Games">▦ <h2>Play</h2><small>Browser games and activities</small></button>
<button class="tile" data-section="Settings">◉ <h2>Personalise</h2><small>Appearance and preferences</small></button>
</section>
<p id="message" role="status" aria-live="polite">Choose a section to begin.</p>
<footer>GLASS TV · Independent web interface · Stock OS unchanged</footer>
</main>
<script>
const message = document.querySelector("#message");
const themes = [
  ["#9dc9ff","#344966","#35304f"],
  ["#a7e6d3","#244d50","#303c53"],
  ["#f0c9a4","#62483d","#49354e"]
];
let themeIndex = 0;
const controls = [...document.querySelectorAll("button")];
let currentControl = null;

function announce(text) { message.textContent = text; }
function visibleControls() {
  return controls.filter(el => {
    const r = el.getBoundingClientRect(), s = getComputedStyle(el);
    return r.width > 0 && r.height > 0 && s.display !== "none" &&
      s.visibility !== "hidden" && !el.disabled;
  });
}
function focusControl(el) {
  if (!el) return;
  currentControl = el;
  el.focus({preventScroll:true});
  el.scrollIntoView({block:"nearest", inline:"nearest"});
}
function current() {
  if (controls.includes(document.activeElement)) return document.activeElement;
  if (currentControl && controls.includes(currentControl)) return currentControl;
  return visibleControls()[0] || null;
}
function moveFocus(dir) {
  const items = visibleControls(), from = current();
  if (!from || items.length < 2) { if(items[0]) focusControl(items[0]); return; }
  const r = from.getBoundingClientRect(), x = r.left+r.width/2, y = r.top+r.height/2;
  let best = null, bestScore = Infinity;
  for (const el of items) {
    if (el === from) continue;
    const q = el.getBoundingClientRect(), dx=q.left+q.width/2-x, dy=q.top+q.height/2-y;
    let primary, cross;
    if(dir==="right"){if(dx<=2)continue;primary=dx;cross=Math.abs(dy);}
    if(dir==="left"){if(dx>=-2)continue;primary=-dx;cross=Math.abs(dy);}
    if(dir==="down"){if(dy<=2)continue;primary=dy;cross=Math.abs(dx);}
    if(dir==="up"){if(dy>=-2)continue;primary=-dy;cross=Math.abs(dx);}
    const score=primary+cross*1.6;
    if(score<bestScore){bestScore=score;best=el;}
  }
  if(!best){
    best=items.filter(el=>el!==from).sort((u,v)=>{
      const score=el=>{
        const q=el.getBoundingClientRect(), cx=q.left+q.width/2, cy=q.top+q.height/2;
        if(dir==="right")return (innerWidth-cx)+Math.abs(cy-y)*1.5;
        if(dir==="left")return cx+Math.abs(cy-y)*1.5;
        if(dir==="down")return (innerHeight-cy)+Math.abs(cx-x)*1.5;
        return cy+Math.abs(cx-x)*1.5;
      };
      return score(u)-score(v);
    })[0];
  }
  focusControl(best);
}
document.addEventListener("focusin", e => { if(controls.includes(e.target)) currentControl=e.target; });
document.addEventListener("keydown", e => {
  const keys={ArrowRight:"right",Right:"right",DPAD_RIGHT:"right",
    ArrowLeft:"left",Left:"left",DPAD_LEFT:"left",
    ArrowDown:"down",Down:"down",DPAD_DOWN:"down",
    ArrowUp:"up",Up:"up",DPAD_UP:"up"};
  if(keys[e.key]) { e.preventDefault(); e.stopPropagation(); moveFocus(keys[e.key]); return; }
  if(["Enter"," ","NumpadEnter","Select","DPAD_CENTER"].includes(e.key)){
    const el=current(); if(el){e.preventDefault();el.click();}
  }
});
document.querySelector("#explore").addEventListener("click",()=>{
  focusControl(document.querySelector('[data-section="Library"]'));
  announce("Library focused. Use the remote arrows and OK.");
});
document.querySelector("#wallpaper").addEventListener("click",()=>{
  themeIndex=(themeIndex+1)%themes.length;
  const [accent,one,two]=themes[themeIndex];
  document.documentElement.style.setProperty("--accent",accent);
  document.body.style.background=`radial-gradient(ellipse at 80% 15%,${one},transparent 42%),radial-gradient(ellipse at 15% 85%,${two},transparent 45%),#10141c`;
  announce("Atmosphere changed.");
});
document.querySelectorAll("[data-section]").forEach(el=>el.addEventListener("click",()=>{
  announce(el.dataset.section+" selected. More features will be added next.");
}));
document.querySelector("#clock").textContent=new Intl.DateTimeFormat(undefined,{hour:"2-digit",minute:"2-digit"}).format(new Date());
window.addEventListener("load",()=>focusControl(document.querySelector("#explore")));
</script>
</body>
</html>
