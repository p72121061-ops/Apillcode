<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#10141c">
<title>Glass TV</title>
<style>
:root{--accent:#9dc9ff;--glass:rgba(255,255,255,.09);--line:rgba(255,255,255,.16)}
*{box-sizing:border-box}
body{margin:0;min-height:100vh;color:#f5f7fb;font-family:system-ui,sans-serif;background:radial-gradient(ellipse at 80% 15%,#344966 0,transparent 42%),radial-gradient(ellipse at 15% 85%,#35304f 0,transparent 45%),#10141c}
main{padding:5vh 6vw;max-width:1500px;margin:auto}
header{display:flex;justify-content:space-between;align-items:center;gap:16px;margin-bottom:8vh}
.logo{letter-spacing:3px;font-size:13px;color:var(--accent)}
.clock{color:#c2cad8}
h1{font-size:clamp(34px,6vw,68px);margin:10px 0}
p{color:#bdc6d5;line-height:1.6}
.panel,.tile{background:var(--glass);border:1px solid var(--line);border-radius:22px;backdrop-filter:blur(18px);-webkit-backdrop-filter:blur(18px)}
.hero{padding:clamp(22px,4vw,42px)}
.cards{display:flex;justify-content:space-between;gap:16px;margin-top:22px;flex-wrap:wrap}
.tile{flex:1 1 180px;min-height:145px;padding:22px;cursor:pointer;color:inherit;text-align:left;font:inherit;transition:transform .18s,border-color .18s}
.tile small{display:block;color:#bdc6d5;margin-top:10px}
button:focus-visible,a:focus-visible{outline:3px solid var(--accent);outline-offset:4px}
.tile:focus-visible,.tile:hover{border-color:var(--accent);transform:translateY(-3px)}
.actions{display:flex;flex-wrap:wrap;gap:12px;margin-top:22px}
.actions button{background:var(--glass);color:white;border:1px solid var(--line);border-radius:30px;padding:12px 18px;cursor:pointer}
#message{min-height:28px;margin-top:20px}
footer{margin-top:38px;font-size:12px;color:#aeb8c8}
@media(max-width:600px){main{padding:24px 18px}header{margin-bottom:40px}.tile{flex-basis:100%}}
</style>
</head>
<body>
<main>
<header><div class="logo">GLASS / TV</div><div class="clock" id="clock">YOUR SPACE</div></header>
<section class="panel hero">
<p>YOUR PERSONAL SCREEN</p><h1>Make yourself<br>at home.</h1>
<p>A quieter, more personal space for your TV.</p>
<div class="actions"><button id="explore">Explore library</button><button id="wallpaper">Change atmosphere</button></div>
</section>
<section class="cards" aria-label="TV sections">
<button class="tile" data-section="Library">◫ <h2>Library</h2><small>Your watchlist and favourites</small></button>
<button class="tile" data-section="Discover">◈ <h2>Discover</h2><small>Your saved websites</small></button>
<button class="tile" data-section="Games">▦ <h2>Play</h2><small>Browser games and activities</small></button>
<button class="tile" data-section="Settings">◉ <h2>Personalise</h2><small>Appearance and preferences</small></button>
</section>
<p id="message" role="status" aria-live="polite">Choose a section to begin.</p>
<footer>GLASS TV · Independent web interface · Stock OS unchanged</footer>
</main>
<script>
const message=document.querySelector("#message");
const themes=[["#9dc9ff","#344966","#35304f"],["#a7e6d3","#244d50","#303c53"],["#f0c9a4","#62483d","#49354e"]];
let themeIndex=0;
function announce(text){message.textContent=text}
document.querySelectorAll("[data-section]").forEach(button=>button.addEventListener("click",()=>announce(button.dataset.section+" selected. Its features will be added in the next phase.")));
document.querySelector("#explore").addEventListener("click",()=>{document.querySelector('[data-section="Library"]').focus();announce("Library selected. Use the remote arrows and OK.")});
document.querySelector("#wallpaper").addEventListener("click",()=>{
themeIndex=(themeIndex+1)%themes.length;
const [accent,one,two]=themes[themeIndex];
document.documentElement.style.setProperty("--accent",accent);
document.body.style.background=`radial-gradient(ellipse at 80% 15%, ${one}, transparent 42%),radial-gradient(ellipse at 15% 85%, ${two}, transparent 45%),#10141c`;
announce("Atmosphere changed.");
});
document.querySelector("#clock").textContent=new Intl.DateTimeFormat(undefined,{hour:"2-digit",minute:"2-digit"}).format(new Date());
</script>
</body>
</html>
