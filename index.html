<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Media Hub</title>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800&display=swap');
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      background: #07070f;
      font-family: 'Inter', sans-serif;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 12px;
      padding: 24px;
    }
    h1 {
      color: #a78bfa;
      font-size: 28px;
      font-weight: 800;
      margin-bottom: 8px;
      letter-spacing: -0.5px;
    }
    p {
      color: #5a5a75;
      font-size: 14px;
      margin-bottom: 32px;
    }
    .buttons {
      display: flex;
      gap: 16px;
      flex-wrap: wrap;
      justify-content: center;
    }
    a {
      background: #13131a;
      border: 1px solid #252538;
      color: #eeeef5;
      padding: 24px 40px;
      border-radius: 20px;
      text-decoration: none;
      font-size: 18px;
      font-weight: 600;
      transition: all 0.15s;
      text-align: center;
      min-width: 160px;
    }
    a:hover { border-color: #6c63ff; transform: translateY(-3px); }
    a .emoji { font-size: 36px; display: block; margin-bottom: 10px; }
  </style>
</head>
<body>
  <h1>Media Hub</h1>
  <p>Apna device choose karo</p>
  <div class="buttons">
    <a href="/mobile.html">
      <span class="emoji">📱</span>
      Mobile
    </a>
    <a href="/tv.html">
      <span class="emoji">📺</span>
      TV
    </a>
  </div>
</body>
</html>
