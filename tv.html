<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Media Hub – TV</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap');

  * { box-sizing: border-box; margin: 0; padding: 0; }

  :root {
    --bg: #07070f;
    --surface: #10101a;
    --surface2: #18182a;
    --border: #252538;
    --accent: #6c63ff;
    --accent2: #a78bfa;
    --text: #eeeef5;
    --muted: #5a5a75;
    --success: #22c55e;
    --focus-glow: 0 0 0 3px #6c63ff, 0 0 24px rgba(108,99,255,0.5);
  }

  body {
    font-family: 'Inter', sans-serif;
    background: var(--bg);
    color: var(--text);
    height: 100vh;
    overflow: hidden;
    user-select: none;
  }

  /* Layout */
  #app {
    display: flex;
    flex-direction: column;
    height: 100vh;
  }

  /* Header */
  header {
    padding: 20px 48px 16px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    border-bottom: 1px solid var(--border);
    flex-shrink: 0;
  }

  .logo {
    font-size: 24px;
    font-weight: 800;
    color: var(--accent2);
    letter-spacing: -0.5px;
  }

  .logo span { color: var(--muted); font-weight: 400; font-size: 15px; margin-left: 10px; }

  .live-dot {
    display: flex;
    align-items: center;
    gap: 8px;
    font-size: 13px;
    color: var(--success);
    font-weight: 500;
  }

  .live-dot::before {
    content: '';
    width: 8px; height: 8px;
    background: var(--success);
    border-radius: 50%;
    animation: pulse 2s infinite;
  }

  @keyframes pulse {
    0%,100% { opacity:1; transform:scale(1); }
    50% { opacity:0.4; transform:scale(1.4); }
  }

  /* Filter row — ZONE 0 */
  #filterRow {
    display: flex;
    gap: 12px;
    padding: 16px 48px;
    flex-shrink: 0;
    border-bottom: 1px solid var(--border);
  }

  .filter-btn {
    background: var(--surface);
    border: 2px solid var(--border);
    border-radius: 50px;
    padding: 10px 24px;
    font-size: 16px;
    font-weight: 500;
    color: var(--muted);
    cursor: pointer;
    white-space: nowrap;
    transition: all 0.15s;
    font-family: 'Inter', sans-serif;
    outline: none;
  }

  .filter-btn.active {
    background: var(--accent);
    border-color: var(--accent);
    color: white;
  }

  .filter-btn.focused {
    box-shadow: var(--focus-glow);
    border-color: var(--accent2);
    color: white;
    background: var(--surface2);
    transform: scale(1.06);
  }

  .filter-btn.active.focused {
    background: var(--accent);
  }

  /* Grid area */
  #gridWrap {
    flex: 1;
    overflow: hidden;
    position: relative;
  }

  #grid {
    display: grid;
    grid-template-columns: repeat(4, 1fr);
    gap: 20px;
    padding: 24px 48px 48px;
    overflow-y: auto;
    height: 100%;
    scroll-behavior: smooth;
  }

  /* Cards */
  .card {
    background: var(--surface);
    border: 2px solid var(--border);
    border-radius: 20px;
    overflow: hidden;
    cursor: pointer;
    transition: transform 0.15s, border-color 0.15s, box-shadow 0.15s;
    outline: none;
  }

  .card.focused {
    border-color: var(--accent);
    box-shadow: var(--focus-glow);
    transform: scale(1.04);
    z-index: 2;
    position: relative;
  }

  .card-thumb {
    height: 140px;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 52px;
    position: relative;
    overflow: hidden;
  }

  .card-thumb.pdf   { background: linear-gradient(135deg,#1a0a0a,#2d1010); }
  .card-thumb.image { background: linear-gradient(135deg,#0a1a0a,#102d10); }
  .card-thumb.video { background: linear-gradient(135deg,#0a0a1a,#10102d); }
  .card-thumb.audio { background: linear-gradient(135deg,#150a1a,#25102d); }
  .card-thumb.link  { background: linear-gradient(135deg,#1a150a,#2d2510); }

  .card-thumb img {
    width:100%; height:100%;
    object-fit:cover;
    position:absolute; inset:0;
  }

  .card-body { padding: 14px 16px; }

  .card-type {
    font-size: 10px;
    font-weight: 700;
    text-transform: uppercase;
    letter-spacing: 1px;
    margin-bottom: 5px;
  }

  .card-type.pdf   { color:#f87171; }
  .card-type.image { color:#4ade80; }
  .card-type.video { color:#60a5fa; }
  .card-type.audio { color:#c084fc; }
  .card-type.link  { color:#fbbf24; }

  .card-title {
    font-size: 15px;
    font-weight: 600;
    line-height: 1.3;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }

  .card-date { font-size: 11px; color: var(--muted); margin-top: 4px; }

  /* Empty */
  .empty {
    grid-column: 1/-1;
    text-align: center;
    padding: 80px 20px;
    color: var(--muted);
  }
  .empty .ei { font-size: 60px; display:block; margin-bottom:16px; }
  .empty h3 { font-size:20px; font-weight:600; color:var(--text); margin-bottom:8px; }

  /* Nav hint */
  #navHint {
    position: fixed;
    bottom: 16px;
    left: 50%;
    transform: translateX(-50%);
    background: var(--surface2);
    border: 1px solid var(--border);
    border-radius: 50px;
    padding: 8px 20px;
    font-size: 13px;
    color: var(--muted);
    z-index: 50;
    display: flex;
    gap: 16px;
  }

  #navHint span { display:flex; align-items:center; gap:5px; }

  kbd {
    background: var(--border);
    border-radius: 4px;
    padding: 2px 7px;
    font-size: 12px;
    font-family: monospace;
    color: var(--text);
  }

  /* Zone indicator */
  #zoneLabel {
    position: fixed;
    top: 16px;
    right: 48px;
    font-size: 12px;
    color: var(--muted);
    background: var(--surface2);
    border: 1px solid var(--border);
    border-radius: 20px;
    padding: 4px 12px;
  }

  /* ===== MODAL ===== */
  #modalOverlay {
    position: fixed;
    inset: 0;
    background: rgba(0,0,0,0.95);
    z-index: 200;
    display: none;
    flex-direction: column;
  }

  #modalOverlay.open { display: flex; }

  #modalHeader {
    padding: 20px 32px;
    border-bottom: 1px solid var(--border);
    display: flex;
    align-items: center;
    justify-content: space-between;
    flex-shrink: 0;
    background: var(--surface);
  }

  #modalHeader h2 { font-size: 20px; font-weight: 700; }

  .modal-hint {
    font-size: 13px;
    color: var(--muted);
    display: flex;
    align-items: center;
    gap: 8px;
  }

  #modalBody {
    flex: 1;
    overflow: auto;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 32px;
  }

  #modalBody iframe {
    width: 100%; height: 100%;
    border: none; border-radius: 12px;
  }

  #modalBody video {
    max-width: 100%; max-height: 100%;
    border-radius: 12px; outline: none;
  }

  #modalBody audio {
    width: 80%;
  }

  #modalBody img {
    max-width: 100%; max-height: 100%;
    border-radius: 12px; object-fit: contain;
  }

  /* PDF Canvas viewer */
  #pdfContainer {
    width: 100%;
    height: 100%;
    overflow-y: auto;
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 16px;
    scroll-behavior: smooth;
  }

  #pdfContainer canvas {
    border-radius: 8px;
    max-width: 100%;
    box-shadow: 0 4px 24px rgba(0,0,0,0.5);
  }

  .pdf-controls {
    position: fixed;
    bottom: 24px;
    left: 50%;
    transform: translateX(-50%);
    background: var(--surface2);
    border: 1px solid var(--border);
    border-radius: 50px;
    padding: 10px 24px;
    display: flex;
    align-items: center;
    gap: 20px;
    z-index: 300;
    font-size: 15px;
  }

  .pdf-controls span { color: var(--muted); }

  .open-link-btn {
    background: var(--accent);
    color: white;
    border: none;
    border-radius: 14px;
    padding: 18px 40px;
    font-size: 18px;
    font-weight: 600;
    font-family: 'Inter', sans-serif;
    cursor: pointer;
    text-decoration: none;
    display: inline-block;
  }

  /* Loading */
  .loading { text-align:center; padding:60px; color:var(--muted); font-size:16px; }
  .spinner {
    width:44px; height:44px;
    border: 3px solid var(--border);
    border-top-color: var(--accent);
    border-radius: 50%;
    animation: spin 0.8s linear infinite;
    margin: 0 auto 16px;
  }
  @keyframes spin { to { transform:rotate(360deg); } }
</style>
</head>
<body>
<div id="app">

  <header>
    <div class="logo">📺 Media Hub <span>TV Panel</span></div>
    <div class="live-dot">Live Sync</div>
  </header>

  <div id="filterRow">
    <button class="filter-btn active" data-filter="all">🌐 All</button>
    <button class="filter-btn" data-filter="pdf">📄 PDFs</button>
    <button class="filter-btn" data-filter="image">🖼️ Images</button>
    <button class="filter-btn" data-filter="video">🎬 Videos</button>
    <button class="filter-btn" data-filter="audio">🎵 Audio</button>
    <button class="filter-btn" data-filter="link">🔗 Links</button>
  </div>

  <div id="gridWrap">
    <div id="grid">
      <div class="loading"><div class="spinner"></div>Loading...</div>
    </div>
  </div>

</div>

<!-- Nav Hint -->
<div id="navHint">
  <span><kbd>↑↓←→</kbd> Navigate</span>
  <span><kbd>OK</kbd> Open</span>
  <span><kbd>Back</kbd> Close</span>
</div>

<!-- Modal -->
<div id="modalOverlay">
  <div id="modalHeader">
    <h2 id="modalTitle"></h2>
    <div class="modal-hint"><kbd>Back</kbd> to close</div>
  </div>
  <div id="modalBody"></div>
</div>

<script type="module">
  import { createClient } from 'https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/+esm';

  const SUPABASE_URL  = 'https://apibpgwficxocziaoebq.supabase.co';
  const SUPABASE_ANON = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImFwaWJwZ3dmaWN4b2N6aWFvZWJxIiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTEyNjcwODMsImV4cCI6MjEwNjg0MzA4M30.Qu0_zVq3yh1xmM9_tXhzBtMGAWFJ6Mi_BySwdkcMzeI';
  const sb = createClient(SUPABASE_URL, SUPABASE_ANON);

  pdfjsLib.GlobalWorkerOptions.workerSrc = 'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js';

  const icons = { pdf:'📄', image:'🖼️', video:'🎬', audio:'🎵', link:'🔗' };

  let allItems = [];
  let currentFilter = 'all';
  let modalOpen = false;

  // ===== NAVIGATION STATE =====
  // zone: 'filters' | 'grid'
  let zone = 'filters';
  let filterIdx = 0;   // 0-5
  let gridIdx   = 0;   // index in current filtered list
  let cols      = 4;   // grid columns

  // ===== LOAD =====
  async function loadItems() {
    const { data, error } = await sb
      .from('media_items').select('*')
      .order('created_at', { ascending: false });
    if (error) { console.error(error); return; }
    allItems = data;
    renderGrid();
  }

  // ===== RENDER =====
  function getFiltered() {
    return currentFilter === 'all'
      ? allItems
      : allItems.filter(i => i.type === currentFilter);
  }

  function renderGrid() {
    const grid = document.getElementById('grid');
    const filtered = getFiltered();

    if (!filtered.length) {
      grid.innerHTML = `<div class="empty"><span class="ei">📭</span><h3>Kuch nahi hai yahan</h3><p>Mobile se add karo!</p></div>`;
      return;
    }

    // clamp gridIdx
    if (gridIdx >= filtered.length) gridIdx = 0;

    grid.innerHTML = filtered.map((item, i) => {
      const isImage = item.type === 'image';
      return `<div class="card" data-idx="${i}" data-item='${JSON.stringify(item).replace(/'/g,"&#39;")}'>
        <div class="card-thumb ${item.type}">
          ${isImage ? `<img src="${item.url}" alt="${item.title}" onerror="this.style.display='none'">` : ''}
          ${!isImage ? icons[item.type]||'📁' : ''}
        </div>
        <div class="card-body">
          <div class="card-type ${item.type}">${item.type}</div>
          <div class="card-title">${item.title}</div>
          <div class="card-date">${new Date(item.created_at).toLocaleDateString('en-IN',{day:'numeric',month:'short',year:'numeric'})}</div>
        </div>
      </div>`;
    }).join('');

    applyFocus();
  }

  function renderFilters() {
    document.querySelectorAll('.filter-btn').forEach((btn, i) => {
      btn.classList.toggle('focused', zone === 'filters' && i === filterIdx);
    });
  }

  function applyFocus() {
    // filters
    renderFilters();

    // grid cards
    document.querySelectorAll('.card').forEach((card, i) => {
      card.classList.toggle('focused', zone === 'grid' && i === gridIdx);
      if (zone === 'grid' && i === gridIdx) {
        card.scrollIntoView({ block: 'nearest', behavior: 'smooth' });
      }
    });
  }

  // ===== KEYBOARD NAV =====
  document.addEventListener('keydown', e => {
    if (modalOpen) {
      if (e.key === 'Escape' || e.key === 'Backspace' || e.key === 'GoBack') {
        closeModal(); e.preventDefault();
      }
      return;
    }

    const filtered = getFiltered();
    const total = filtered.length;

    switch(e.key) {
      case 'ArrowLeft':
        if (zone === 'filters') {
          filterIdx = Math.max(0, filterIdx - 1);
        } else {
          if (gridIdx % cols === 0) { zone = 'filters'; filterIdx = 0; }
          else gridIdx = Math.max(0, gridIdx - 1);
        }
        e.preventDefault(); break;

      case 'ArrowRight':
        if (zone === 'filters') {
          const btns = document.querySelectorAll('.filter-btn');
          filterIdx = Math.min(btns.length - 1, filterIdx + 1);
        } else {
          if ((gridIdx + 1) % cols !== 0 && gridIdx + 1 < total)
            gridIdx++;
        }
        e.preventDefault(); break;

      case 'ArrowDown':
        if (zone === 'filters') {
          zone = 'grid'; gridIdx = 0;
        } else {
          if (gridIdx + cols < total) gridIdx += cols;
        }
        e.preventDefault(); break;

      case 'ArrowUp':
        if (zone === 'grid') {
          if (gridIdx < cols) { zone = 'filters'; }
          else gridIdx -= cols;
        }
        e.preventDefault(); break;

      case 'Enter':
      case ' ':
        if (zone === 'filters') {
          const btns = document.querySelectorAll('.filter-btn');
          btns[filterIdx].click();
        } else {
          const cards = document.querySelectorAll('.card');
          if (cards[gridIdx]) {
            const item = JSON.parse(cards[gridIdx].dataset.item.replace(/&#39;/g,"'"));
            openItem(item);
          }
        }
        e.preventDefault(); break;

      case 'Escape':
      case 'Backspace':
        if (zone === 'grid') { zone = 'filters'; }
        e.preventDefault(); break;
    }

    applyFocus();
  });

  // Filter click handler
  document.querySelectorAll('.filter-btn').forEach((btn, i) => {
    btn.addEventListener('click', () => {
      currentFilter = btn.dataset.filter;
      document.querySelectorAll('.filter-btn').forEach(b => b.classList.remove('active'));
      btn.classList.add('active');
      filterIdx = i;
      gridIdx = 0;
      renderGrid();
    });
  });

  // ===== OPEN ITEM =====
  async function openItem(item) {
    modalOpen = true;
    document.getElementById('modalOverlay').classList.add('open');
    document.getElementById('modalTitle').textContent = item.title;
    const body = document.getElementById('modalBody');
    body.innerHTML = '<div class="loading"><div class="spinner"></div>Loading...</div>';

    if (item.type === 'pdf') {
      body.innerHTML = '<div id="pdfContainer"></div>';
      const container = document.getElementById('pdfContainer');
      try {
        const pdf = await pdfjsLib.getDocument(item.url).promise;
        for (let p = 1; p <= pdf.numPages; p++) {
          const page = await pdf.getPage(p);
          const vp = page.getViewport({ scale: 1.6 });
          const canvas = document.createElement('canvas');
          canvas.width = vp.width;
          canvas.height = vp.height;
          container.appendChild(canvas);
          await page.render({ canvasContext: canvas.getContext('2d'), viewport: vp }).promise;
        }
      } catch(err) {
        container.innerHTML = `<p style="color:#f87171">PDF load nahi hua: ${err.message}</p>`;
      }
    } else if (item.type === 'image') {
      body.innerHTML = `<img src="${item.url}" alt="${item.title}">`;
    } else if (item.type === 'video') {
      body.innerHTML = `<video controls autoplay><source src="${item.url}"><p>Video nahi chal raha.</p></video>`;
    } else if (item.type === 'audio') {
      body.innerHTML = `<audio controls autoplay style="width:80%"><source src="${item.url}"></audio>`;
    } else if (item.type === 'link') {
      body.innerHTML = `
        <div style="text-align:center">
          <div style="font-size:56px;margin-bottom:16px">🔗</div>
          <p style="color:var(--muted);margin-bottom:28px;font-size:16px;max-width:600px">${item.url}</p>
          <a href="${item.url}" target="_blank" class="open-link-btn">Open Link ↗</a>
        </div>`;
    }
  }

  function closeModal() {
    modalOpen = false;
    document.getElementById('modalOverlay').classList.remove('open');
    document.getElementById('modalBody').innerHTML = '';
    applyFocus();
  }

  // Real-time
  sb.channel('tv_media')
    .on('postgres_changes', { event:'*', schema:'public', table:'media_items' }, () => loadItems())
    .subscribe();

  loadItems();
  applyFocus();
</script>
</body>
</html>
