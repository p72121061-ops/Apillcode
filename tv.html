<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Media Hub – TV</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap');

  * { box-sizing: border-box; margin: 0; padding: 0; }

  :root {
    --bg: #f0f2f5;
    --surface: #ffffff;
    --surface2: #e8eaed;
    --border: #d1d5db;
    --accent: #4f46e5;
    --accent2: #7c3aed;
    --text: #111827;
    --muted: #6b7280;
    --success: #16a34a;
    --focus-glow: 0 0 0 3px #4f46e5, 0 0 20px rgba(79,70,229,0.3);
  }

  body {
    font-family: 'Inter', sans-serif;
    background: var(--bg);
    color: var(--text);
    height: 100vh;
    overflow: hidden;
    user-select: none;
  }

  #app { display: flex; flex-direction: column; height: 100vh; }

  /* Header */
  header {
    padding: 16px 48px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    border-bottom: 1px solid var(--border);
    background: var(--surface);
    flex-shrink: 0;
    box-shadow: 0 1px 4px rgba(0,0,0,0.06);
  }

  .logo {
    font-size: 22px;
    font-weight: 800;
    color: var(--accent);
    letter-spacing: -0.5px;
  }

  .logo span { color: var(--muted); font-weight: 400; font-size: 14px; margin-left: 10px; }

  .live-dot {
    display: flex;
    align-items: center;
    gap: 8px;
    font-size: 13px;
    color: var(--success);
    font-weight: 600;
  }

  .live-dot::before {
    content: '';
    width: 8px; height: 8px;
    background: var(--success);
    border-radius: 50%;
    animation: pulse 2s infinite;
  }

  @keyframes pulse {
    0%,100% { opacity:1; transform:scale(1); }
    50% { opacity:0.4; transform:scale(1.4); }
  }

  /* Filters */
  #filterRow {
    display: flex;
    gap: 10px;
    padding: 14px 48px;
    flex-shrink: 0;
    background: var(--surface);
    border-bottom: 1px solid var(--border);
  }

  .filter-btn {
    background: var(--surface2);
    border: 2px solid transparent;
    border-radius: 50px;
    padding: 9px 22px;
    font-size: 15px;
    font-weight: 500;
    color: var(--muted);
    cursor: pointer;
    white-space: nowrap;
    transition: all 0.15s;
    font-family: 'Inter', sans-serif;
    outline: none;
  }

  .filter-btn.active {
    background: var(--accent);
    color: white;
    border-color: var(--accent);
  }

  .filter-btn.focused {
    box-shadow: var(--focus-glow);
    border-color: var(--accent);
    transform: scale(1.05);
  }

  /* Grid */
  #gridWrap { flex: 1; overflow: hidden; }

  #grid {
    display: grid;
    grid-template-columns: repeat(4, 1fr);
    gap: 18px;
    padding: 22px 48px 48px;
    overflow-y: auto;
    height: 100%;
    scroll-behavior: smooth;
  }

  /* Cards */
  .card {
    background: var(--surface);
    border: 2px solid var(--border);
    border-radius: 18px;
    overflow: hidden;
    cursor: pointer;
    transition: all 0.15s;
    outline: none;
    box-shadow: 0 1px 4px rgba(0,0,0,0.06);
  }

  .card.focused {
    border-color: var(--accent);
    box-shadow: var(--focus-glow);
    transform: scale(1.04);
    z-index: 2;
    position: relative;
  }

  .card-thumb {
    height: 130px;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 48px;
    position: relative;
    overflow: hidden;
  }

  /* Dark thumbnails on light card — contrast! */
  .card-thumb.pdf   { background: #1e1a2e; }
  .card-thumb.image { background: #0f1f0f; }
  .card-thumb.video { background: #0f0f1f; }
  .card-thumb.audio { background: #1f0f1f; }
  .card-thumb.link  { background: #1f1a0f; }

  .card-thumb img {
    width:100%; height:100%;
    object-fit:cover;
    position:absolute; inset:0;
  }

  .card-body { padding: 13px 15px; }

  .card-type {
    font-size: 10px;
    font-weight: 700;
    text-transform: uppercase;
    letter-spacing: 1px;
    margin-bottom: 4px;
  }

  .card-type.pdf   { color:#dc2626; }
  .card-type.image { color:#16a34a; }
  .card-type.video { color:#2563eb; }
  .card-type.audio { color:#7c3aed; }
  .card-type.link  { color:#d97706; }

  .card-title {
    font-size: 14px;
    font-weight: 600;
    line-height: 1.3;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
    color: var(--text);
  }

  .card-date { font-size: 11px; color: var(--muted); margin-top: 3px; }

  .open-card-btn {
    margin-top: 10px;
    width: 100%;
    padding: 9px;
    background: var(--accent);
    color: white;
    border: none;
    border-radius: 10px;
    font-size: 14px;
    font-weight: 700;
    font-family: 'Inter', sans-serif;
    cursor: pointer;
    transition: background 0.15s;
    letter-spacing: 0.3px;
  }
  .open-card-btn:hover { background: #4338ca; }

  /* Empty */
  .empty {
    grid-column: 1/-1;
    text-align: center;
    padding: 80px 20px;
    color: var(--muted);
  }
  .empty .ei { font-size: 56px; display:block; margin-bottom:14px; }
  .empty h3 { font-size:20px; font-weight:600; color:var(--text); margin-bottom:8px; }

  /* Loading */
  .loading { text-align:center; padding:60px; color:var(--muted); font-size:16px; }
  .spinner {
    width:40px; height:40px;
    border: 3px solid var(--border);
    border-top-color: var(--accent);
    border-radius: 50%;
    animation: spin 0.8s linear infinite;
    margin: 0 auto 14px;
  }
  @keyframes spin { to { transform:rotate(360deg); } }

  /* ===== MODAL ===== */
  #modalOverlay {
    position: fixed;
    inset: 0;
    background: rgba(0,0,0,0.7);
    z-index: 200;
    display: none;
    align-items: center;
    justify-content: center;
    padding: 24px;
  }

  #modalOverlay.open { display: flex; }

  .modal-box {
    background: #1a1a2e;
    border-radius: 24px;
    width: 100%;
    max-width: 1000px;
    max-height: 90vh;
    overflow: hidden;
    display: flex;
    flex-direction: column;
    box-shadow: 0 24px 80px rgba(0,0,0,0.5);
  }

  #modalHeader {
    padding: 18px 24px;
    border-bottom: 1px solid #2a2a3a;
    display: flex;
    align-items: center;
    justify-content: space-between;
    flex-shrink: 0;
    background: #13131f;
  }

  #modalHeader h2 { font-size: 18px; font-weight: 700; color: #eeeef5; }

  .modal-actions { display: flex; gap: 10px; align-items: center; }

  .modal-btn {
    background: #252538;
    border: 1px solid #3a3a4a;
    border-radius: 10px;
    padding: 8px 16px;
    font-size: 14px;
    font-weight: 600;
    color: #eeeef5;
    cursor: pointer;
    font-family: 'Inter', sans-serif;
    transition: background 0.15s;
    display: flex;
    align-items: center;
    gap: 6px;
  }

  .modal-btn:hover { background: #3a3a4a; }

  .modal-btn.close-btn {
    background: #3a1a1a;
    border-color: #5a2a2a;
    color: #f87171;
  }

  .modal-btn.close-btn:hover { background: #5a2a2a; }

  #modalBody {
    flex: 1;
    overflow: auto;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 24px;
    background: #0f0f1a;
  }

  #modalBody video {
    max-width: 100%; max-height: 65vh;
    border-radius: 10px; outline: none;
  }

  #modalBody audio { width: 80%; }

  #modalBody img {
    max-width: 100%; max-height: 65vh;
    border-radius: 10px; object-fit: contain;
  }

  /* PDF */
  #pdfContainer {
    width: 100%;
    height: 100%;
    overflow-y: auto;
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 12px;
  }

  #pdfContainer canvas {
    border-radius: 6px;
    max-width: 100%;
    box-shadow: 0 4px 20px rgba(0,0,0,0.6);
  }

  .open-link-btn {
    background: var(--accent);
    color: white;
    border: none;
    border-radius: 14px;
    padding: 18px 40px;
    font-size: 18px;
    font-weight: 600;
    font-family: 'Inter', sans-serif;
    cursor: pointer;
    text-decoration: none;
    display: inline-block;
  }

  .link-url {
    color: #a0a0b0;
    font-size: 15px;
    margin-bottom: 24px;
    max-width: 600px;
    word-break: break-all;
    text-align: center;
  }

  /* ===== TV REMOTE / PLAYER CONTROLS ===== */
  .player-controls { width:100%; padding:14px 18px; background:#13131f; border-top:1px solid #2a2a3a; flex-shrink:0; }
  .control-row { display:flex; align-items:center; justify-content:center; gap:10px; flex-wrap:wrap; }
  .control-label { color:#a0a0b0; font-size:13px; margin-right:4px; }
  .speed-btn, .pdf-control-btn {
    background:#252538; border:2px solid #3a3a4a; color:#eeeef5; border-radius:10px;
    padding:9px 14px; font-size:14px; font-weight:700; font-family:Inter,sans-serif;
    cursor:pointer; outline:none; min-width:58px;
  }
  .speed-btn.active { background:var(--accent); border-color:var(--accent); color:#fff; }
  .speed-btn.unsupported { opacity:.55; }
  .speed-btn.focused, .pdf-control-btn.focused, .modal-btn.focused {
    box-shadow:var(--focus-glow); border-color:var(--accent); transform:scale(1.05); z-index:3;
  }
  .speed-status { font-size:12px; color:#a0a0b0; min-width:110px; text-align:center; }
  .speed-status.ok { color:#4ade80; }
  .speed-status.bad { color:#f87171; }
  #pdfContainer { scroll-behavior:smooth; }
  #pdfContainer canvas { width:auto; max-width:100%; height:auto; }
  .image-viewer { width:100%; height:100%; display:flex; align-items:center; justify-content:center; overflow:hidden; }
  .image-viewer img { width:auto; height:auto; max-width:88vw; max-height:72vh; object-fit:contain; }
  @media (min-width:1200px) {
    .modal-box { max-width:92vw; max-height:92vh; }
    #modalBody video { max-width:88vw; max-height:72vh; }
  }
</style>
</head>
<body>
<div id="app">

  <header>
    <div class="logo">📺 Media Hub <span>TV Panel</span></div>
    <div class="live-dot">Live</div>
  </header>

  <div id="filterRow">
    <button class="filter-btn active" data-filter="all">🌐 All</button>
    <button class="filter-btn" data-filter="pdf">📄 PDFs</button>
    <button class="filter-btn" data-filter="image">🖼️ Images</button>
    <button class="filter-btn" data-filter="video">🎬 Videos</button>
    <button class="filter-btn" data-filter="audio">🎵 Audio</button>
    <button class="filter-btn" data-filter="link">🔗 Links</button>
  </div>

  <div id="gridWrap">
    <div id="grid">
      <div class="loading"><div class="spinner"></div>Loading...</div>
    </div>
  </div>

</div>

<!-- Modal -->
<div id="modalOverlay">
  <div class="modal-box">
    <div id="modalHeader">
      <h2 id="modalTitle"></h2>
      <div class="modal-actions">
        <button class="modal-btn" id="fsBtn" tabindex="0" onclick="toggleFullscreen()">⛶ Fullscreen</button>
        <button class="modal-btn close-btn" id="closeBtn" tabindex="0" onclick="closeModal()">✕ Close</button>
      </div>
    </div>
    <div id="modalBody"></div>
  </div>
</div>

<script type="module">
  import { createClient } from 'https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/+esm';

  const sb = createClient(
    'https://apibpgwficxocziaoebq.supabase.co',
    'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImFwaWJwZ3dmaWN4b2N6aWFvZWJxIiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTEyNjcwODMsImV4cCI6MjEwNjg0MzA4M30.Qu0_zVq3yh1xmM9_tXhzBtMGAWFJ6Mi_BySwdkcMzeI'
  );

  pdfjsLib.GlobalWorkerOptions.workerSrc = 'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js';

  const icons = { pdf:'📄', image:'🖼️', video:'🎬', audio:'🎵', link:'🔗' };

  let allItems = [];
  let currentFilter = 'all';
  let modalOpen = false;

  // Nav state
  let zone = 'filters';
  let filterIdx = 0;
  let gridIdx = 0;
  const cols = 4;

  // ===== LOAD =====
  async function loadItems() {
    const { data, error } = await sb
      .from('media_items').select('*')
      .order('created_at', { ascending: false });
    if (error) { console.error(error); return; }
    allItems = data;
    renderGrid();
  }

  function getFiltered() {
    return currentFilter === 'all' ? allItems : allItems.filter(i => i.type === currentFilter);
  }

  // ===== RENDER =====
  function renderGrid() {
    const grid = document.getElementById('grid');
    const filtered = getFiltered();
    if (gridIdx >= filtered.length) gridIdx = 0;

    if (!filtered.length) {
      grid.innerHTML = `<div class="empty"><span class="ei">📭</span><h3>Kuch nahi hai yahan</h3><p>Mobile se add karo!</p></div>`;
      return;
    }

    grid.innerHTML = filtered.map((item, i) => {
      const isImage = item.type === 'image';
      const safe = JSON.stringify(item).replace(/'/g,"&#39;").replace(/"/g,'&quot;');
      return `<div class="card" data-idx="${i}" data-item='${safe}'>
        <div class="card-thumb ${item.type}">
          ${isImage ? `<img src="${item.url}" alt="${item.title}" onerror="this.style.display='none'">` : ''}
          ${!isImage ? icons[item.type]||'📁' : ''}
        </div>
        <div class="card-body">
          <div class="card-type ${item.type}">${item.type}</div>
          <div class="card-title">${item.title}</div>
          <div class="card-date">${new Date(item.created_at).toLocaleDateString('en-IN',{day:'numeric',month:'short',year:'numeric'})}</div>
          <button class="open-card-btn" onclick="openByIdx(${i})">▶ Open</button>
        </div>
      </div>`;
    }).join('');

    applyFocus();
  }

  function applyFocus() {
    document.querySelectorAll('.filter-btn').forEach((btn, i) => {
      btn.classList.toggle('focused', zone === 'filters' && i === filterIdx);
    });
    document.querySelectorAll('.card').forEach((card, i) => {
      card.classList.toggle('focused', zone === 'grid' && i === gridIdx);
      if (zone === 'grid' && i === gridIdx) {
        card.scrollIntoView({ block: 'nearest', behavior: 'smooth' });
      }
    });
  }

  // ===== KEYBOARD =====
  document.addEventListener('keydown', e => {
    if (modalOpen) {
      if (e.key === 'Escape' || e.key === 'Backspace') { closeModal(); e.preventDefault(); return; }
      if (e.key === 'f' || e.key === 'F') { toggleFullscreen(); e.preventDefault(); return; }
      if (e.key === 'ArrowRight' || e.key === 'ArrowDown') { moveModalFocus(1); e.preventDefault(); return; }
      if (e.key === 'ArrowLeft' || e.key === 'ArrowUp') { moveModalFocus(-1); e.preventDefault(); return; }
      if (e.key === 'Enter' || e.key === ' ') {
        const el = modalFocusables[modalFocusIdx];
        if (el) { el.click(); e.preventDefault(); }
        return;
      }
      return;
    }

    const total = getFiltered().length;
    const filterBtns = document.querySelectorAll('.filter-btn').length;

    switch(e.key) {
      case 'ArrowLeft':
        if (zone === 'filters') filterIdx = Math.max(0, filterIdx - 1);
        else if (gridIdx % cols === 0) { zone = 'filters'; filterIdx = 0; }
        else gridIdx--;
        e.preventDefault(); break;

      case 'ArrowRight':
        if (zone === 'filters') filterIdx = Math.min(filterBtns - 1, filterIdx + 1);
        else if ((gridIdx + 1) % cols !== 0 && gridIdx + 1 < total) gridIdx++;
        e.preventDefault(); break;

      case 'ArrowDown':
        if (zone === 'filters') { zone = 'grid'; gridIdx = 0; }
        else if (gridIdx + cols < total) gridIdx += cols;
        e.preventDefault(); break;

      case 'ArrowUp':
        if (zone === 'grid') { if (gridIdx < cols) zone = 'filters'; else gridIdx -= cols; }
        e.preventDefault(); break;

      case 'Enter': case ' ':
        if (zone === 'filters') document.querySelectorAll('.filter-btn')[filterIdx].click();
        else {
          const cards = document.querySelectorAll('.card');
          if (cards[gridIdx]) {
            const item = JSON.parse(cards[gridIdx].dataset.item.replace(/&#39;/g,"'"));
            openItem(item);
          }
        }
        e.preventDefault(); break;

      case 'Escape': case 'Backspace':
        if (zone === 'grid') zone = 'filters';
        e.preventDefault(); break;
    }
    applyFocus();
  });

  // Filter click
  document.querySelectorAll('.filter-btn').forEach((btn, i) => {
    btn.addEventListener('click', () => {
      currentFilter = btn.dataset.filter;
      document.querySelectorAll('.filter-btn').forEach(b => b.classList.remove('active'));
      btn.classList.add('active');
      filterIdx = i; gridIdx = 0;
      renderGrid();
    });
  });

  // Called from open button on card
  window.openByIdx = (i) => {
    const filtered = getFiltered();
    if (filtered[i]) openItem(filtered[i]);
  };

  // ===== OPEN ITEM =====
  async function openItem(item) {
    modalOpen = true;
    document.getElementById('modalOverlay').classList.add('open');
    document.getElementById('modalTitle').textContent = item.title;
    const body = document.getElementById('modalBody');
    body.innerHTML = '<div class="loading"><div class="spinner"></div>Loading...</div>';

    if (item.type === 'pdf') {
      body.style.flexDirection = 'column'; body.style.padding = '0';
      body.innerHTML = `
        <div id="pdfContainer" style="flex:1;overflow:auto;padding:18px;display:flex;flex-direction:column;align-items:center;gap:12px;width:100%"></div>
        <div id="pdfNav" class="player-controls">
          <div class="control-row">
            <button class="pdf-control-btn" id="pdfPrev" tabindex="0">◀ Prev</button>
            <span id="pdfPageLabel" class="speed-status">Page 1</span>
            <button class="pdf-control-btn" id="pdfNext" tabindex="0">Next ▶</button>
            <button class="pdf-control-btn" id="pdfZoomOut" tabindex="0">− Zoom</button>
            <button class="pdf-control-btn" id="pdfZoomIn" tabindex="0">＋ Zoom</button>
          </div>
        </div>`;

      const container = document.getElementById('pdfContainer');
      let currentPage = 1, totalPages = 1, pdfDoc = null, pdfScale = 1.0;

      const renderPage = async (num) => {
        container.innerHTML = '<div class="loading"><div class="spinner"></div>Loading...</div>';
        const page = await pdfDoc.getPage(num);
        // Fit a 32-inch TV viewport while keeping the document readable.
        const availableWidth = Math.max(500, container.clientWidth - 36);
        const base = page.getViewport({scale:1});
        const fitScale = availableWidth / base.width;
        const scale = Math.max(0.75, Math.min(2.2, fitScale * pdfScale));
        const vp = page.getViewport({scale});
        const canvas = document.createElement('canvas');
        canvas.width = Math.floor(vp.width); canvas.height = Math.floor(vp.height);
        canvas.style.maxWidth = '100%'; canvas.style.height = 'auto';
        container.innerHTML = ''; container.appendChild(canvas);
        await page.render({canvasContext:canvas.getContext('2d'), viewport:vp}).promise;
        document.getElementById('pdfPageLabel').textContent = `Page ${num} / ${totalPages}`;
      };

      window.pdfPageNav = async (dir) => {
        const next = currentPage + dir;
        if (next < 1 || next > totalPages) return;
        currentPage = next; await renderPage(currentPage);
      };
      window.pdfZoom = async (dir) => {
        pdfScale = Math.max(0.75, Math.min(1.8, pdfScale + dir * 0.15));
        await renderPage(currentPage);
      };
      document.getElementById('pdfPrev').onclick = () => pdfPageNav(-1);
      document.getElementById('pdfNext').onclick = () => pdfPageNav(1);
      document.getElementById('pdfZoomOut').onclick = () => pdfZoom(-1);
      document.getElementById('pdfZoomIn').onclick = () => pdfZoom(1);

      try {
        pdfDoc = await pdfjsLib.getDocument(item.url).promise;
        totalPages = pdfDoc.numPages;
        await renderPage(1);
        setModalFocusables('pdf');
      } catch(err) {
        container.innerHTML = `<p style="color:#f87171;padding:20px">PDF load nahi hua. Browser/network ne PDF support nahi diya.</p>`;
      }

    } else if (item.type === 'image') {
      body.innerHTML = `<div class="image-viewer"><img src="${item.url}" alt="${item.title}"></div>`;
      setModalFocusables('image');
    } else if (item.type === 'video') {
      body.innerHTML = `
        <div style="width:100%;display:flex;flex-direction:column;align-items:center;gap:12px">
          <video id="mainVideo" controls autoplay playsinline style="max-width:88vw;max-height:70vh;width:auto;height:auto"><source src="${item.url}"></video>
          <div class="player-controls" id="videoControls">
            <div class="control-row">
              <span class="control-label">Speed</span>
              <button class="speed-btn" data-speed="0.5" tabindex="0">0.5x</button>
              <button class="speed-btn" data-speed="0.75" tabindex="0">0.75x</button>
              <button class="speed-btn active" data-speed="1" tabindex="0">1x</button>
              <button class="speed-btn" data-speed="1.25" tabindex="0">1.25x</button>
              <button class="speed-btn" data-speed="1.5" tabindex="0">1.5x</button>
              <button class="speed-btn" data-speed="1.75" tabindex="0">1.75x</button>
              <button class="speed-btn" data-speed="2" tabindex="0">2x</button>
              <button class="speed-btn" data-speed="2.5" tabindex="0">2.5x</button>
              <button class="speed-btn" data-speed="3" tabindex="0">3x</button>
              <span id="speedStatus" class="speed-status">1x • Supported</span>
            </div>
          </div>
        </div>`;
      const video = document.getElementById('mainVideo');
      const speedButtons = [...document.querySelectorAll('.speed-btn')];
      const status = document.getElementById('speedStatus');
      const testSpeed = (value) => {
        try {
          video.playbackRate = value;
          return Math.abs(video.playbackRate - value) < 0.01;
        } catch(e) { return false; }
      };
      speedButtons.forEach(btn => {
        const value = Number(btn.dataset.speed);
        const supported = testSpeed(value);
        btn.classList.toggle('unsupported', !supported);
        btn.title = supported ? 'Supported' : 'Not supported';
        btn.onclick = () => {
          if (!testSpeed(value)) {
            status.textContent = `${value}x • Not supported`;
            status.className = 'speed-status bad';
            return;
          }
          video.playbackRate = value;
          speedButtons.forEach(b => b.classList.remove('active'));
          btn.classList.add('active');
          status.textContent = `${value}x • Supported`;
          status.className = 'speed-status ok';
        };
      });
      setModalFocusables('video');
    } else if (item.type === 'audio') {
      body.innerHTML = `<div style="width:90%;max-width:850px"><audio id="mainAudio" controls autoplay style="width:100%"><source src="${item.url}"></audio></div>`;
      setModalFocusables('audio');
    } else if (item.type === 'link') {
      body.innerHTML = `
        <div style="text-align:center">
          <div style="font-size:52px;margin-bottom:16px">🔗</div>
          <p class="link-url">${item.url}</p>
          <a href="${item.url}" target="_blank" class="open-link-btn" tabindex="0">Open Link ↗</a>
        </div>`;
      setModalFocusables('link');
    }
  }

  // ===== INNER TV FOCUS NAVIGATION =====
  let modalFocusables = [];
  let modalFocusIdx = 0;
  function setModalFocusables(type) {
    modalFocusables = [...document.querySelectorAll('#modalOverlay button[tabindex="0"], #modalOverlay a[tabindex="0"]')];
    modalFocusIdx = 0;
    applyModalFocus();
  }
  function applyModalFocus() {
    modalFocusables.forEach((el,i) => el.classList.toggle('focused', i === modalFocusIdx));
    const el = modalFocusables[modalFocusIdx];
    if (el) el.scrollIntoView({block:'nearest', inline:'nearest', behavior:'smooth'});
  }
  function moveModalFocus(dir) {
    if (!modalFocusables.length) return;
    modalFocusIdx = Math.max(0, Math.min(modalFocusables.length - 1, modalFocusIdx + dir));
    applyModalFocus();
  }

  window.closeModal = () => {
    modalOpen = false;
    document.getElementById('modalOverlay').classList.remove('open');
    document.getElementById('modalBody').innerHTML = '';
    modalFocusables = []; modalFocusIdx = 0;
    if (document.fullscreenElement) document.exitFullscreen();
    applyFocus();
  };

  window.toggleFullscreen = () => {
    const box = document.querySelector('.modal-box');
    const btn = document.getElementById('fsBtn');
    if (!document.fullscreenElement) {
      box.requestFullscreen();
      btn.textContent = '⛶ Exit Fullscreen';
    } else {
      document.exitFullscreen();
      btn.textContent = '⛶ Fullscreen';
    }
  };

  document.addEventListener('fullscreenchange', () => {
    const btn = document.getElementById('fsBtn');
    if (btn) btn.textContent = document.fullscreenElement ? '⛶ Exit Fullscreen' : '⛶ Fullscreen';
  });

  // Realtime
  sb.channel('tv_media')
    .on('postgres_changes', { event:'*', schema:'public', table:'media_items' }, () => loadItems())
    .subscribe();

  loadItems();
  applyFocus();
</script>
</body>
</html>
