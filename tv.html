<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Media Hub – TV</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap');

  * { box-sizing: border-box; margin: 0; padding: 0; }

  :root {
    --bg: #07070f;
    --surface: #10101a;
    --surface2: #18182a;
    --border: #252538;
    --accent: #6c63ff;
    --accent2: #a78bfa;
    --text: #eeeef5;
    --muted: #5a5a75;
    --success: #22c55e;
  }

  body {
    font-family: 'Inter', sans-serif;
    background: var(--bg);
    color: var(--text);
    min-height: 100vh;
    overflow-x: hidden;
  }

  /* Header */
  header {
    padding: 28px 48px 20px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    border-bottom: 1px solid var(--border);
  }

  .logo {
    font-size: 26px;
    font-weight: 800;
    color: var(--accent2);
    letter-spacing: -0.5px;
  }

  .logo span { color: var(--muted); font-weight: 400; font-size: 16px; margin-left: 12px; }

  .live-dot {
    display: flex;
    align-items: center;
    gap: 8px;
    font-size: 14px;
    color: var(--success);
    font-weight: 500;
  }

  .live-dot::before {
    content: '';
    width: 8px;
    height: 8px;
    background: var(--success);
    border-radius: 50%;
    animation: pulse 2s infinite;
  }

  @keyframes pulse {
    0%, 100% { opacity: 1; transform: scale(1); }
    50% { opacity: 0.5; transform: scale(1.3); }
  }

  /* Filter tabs */
  .filters {
    display: flex;
    gap: 10px;
    padding: 20px 48px;
    overflow-x: auto;
  }

  .filter-btn {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 50px;
    padding: 10px 22px;
    font-size: 15px;
    font-weight: 500;
    color: var(--muted);
    cursor: pointer;
    white-space: nowrap;
    transition: all 0.15s;
    font-family: 'Inter', sans-serif;
  }

  .filter-btn.active {
    background: var(--accent);
    border-color: var(--accent);
    color: white;
  }

  /* Grid */
  .grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
    gap: 20px;
    padding: 0 48px 48px;
  }

  .card {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 20px;
    overflow: hidden;
    cursor: pointer;
    transition: transform 0.2s, border-color 0.2s;
  }

  .card:hover {
    transform: translateY(-4px);
    border-color: var(--accent);
  }

  .card-thumb {
    height: 160px;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 56px;
    position: relative;
    overflow: hidden;
  }

  .card-thumb.pdf { background: linear-gradient(135deg, #1a0a0a, #2d1010); }
  .card-thumb.image { background: linear-gradient(135deg, #0a1a0a, #102d10); }
  .card-thumb.video { background: linear-gradient(135deg, #0a0a1a, #10102d); }
  .card-thumb.audio { background: linear-gradient(135deg, #150a1a, #25102d); }
  .card-thumb.link { background: linear-gradient(135deg, #1a150a, #2d2510); }

  .card-thumb img {
    width: 100%;
    height: 100%;
    object-fit: cover;
    position: absolute;
    inset: 0;
  }

  .card-body { padding: 16px 18px; }

  .card-type {
    font-size: 11px;
    font-weight: 600;
    text-transform: uppercase;
    letter-spacing: 0.8px;
    margin-bottom: 6px;
  }

  .card-type.pdf { color: #f87171; }
  .card-type.image { color: #4ade80; }
  .card-type.video { color: #60a5fa; }
  .card-type.audio { color: #c084fc; }
  .card-type.link { color: #fbbf24; }

  .card-title {
    font-size: 16px;
    font-weight: 600;
    line-height: 1.3;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }

  .card-date {
    font-size: 12px;
    color: var(--muted);
    margin-top: 6px;
  }

  /* Empty */
  .empty {
    grid-column: 1/-1;
    text-align: center;
    padding: 80px 20px;
    color: var(--muted);
  }

  .empty .empty-icon { font-size: 60px; display: block; margin-bottom: 16px; }
  .empty h3 { font-size: 20px; font-weight: 600; margin-bottom: 8px; color: var(--text); }
  .empty p { font-size: 15px; }

  /* MODAL */
  .modal-overlay {
    position: fixed;
    inset: 0;
    background: rgba(0,0,0,0.92);
    z-index: 1000;
    display: none;
    align-items: center;
    justify-content: center;
    padding: 24px;
  }

  .modal-overlay.open { display: flex; }

  .modal {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 24px;
    width: 100%;
    max-width: 960px;
    max-height: 90vh;
    overflow: hidden;
    display: flex;
    flex-direction: column;
  }

  .modal-header {
    padding: 20px 24px;
    border-bottom: 1px solid var(--border);
    display: flex;
    align-items: center;
    justify-content: space-between;
    flex-shrink: 0;
  }

  .modal-header h2 { font-size: 18px; font-weight: 600; }

  .modal-close {
    background: var(--surface2);
    border: 1px solid var(--border);
    border-radius: 10px;
    width: 38px;
    height: 38px;
    font-size: 18px;
    cursor: pointer;
    color: var(--text);
    display: flex;
    align-items: center;
    justify-content: center;
    transition: background 0.15s;
  }

  .modal-close:hover { background: var(--border); }

  .modal-body {
    flex: 1;
    overflow: auto;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 24px;
    min-height: 400px;
  }

  /* Media renderers */
  .modal-body iframe {
    width: 100%;
    height: 600px;
    border: none;
    border-radius: 12px;
  }

  .modal-body video,
  .modal-body audio {
    width: 100%;
    border-radius: 12px;
    outline: none;
  }

  .modal-body img {
    max-width: 100%;
    max-height: 600px;
    border-radius: 12px;
    object-fit: contain;
  }

  .open-link-btn {
    background: var(--accent);
    color: white;
    border: none;
    border-radius: 14px;
    padding: 16px 32px;
    font-size: 17px;
    font-weight: 600;
    font-family: 'Inter', sans-serif;
    cursor: pointer;
    text-decoration: none;
    display: inline-block;
    transition: background 0.15s;
  }

  .open-link-btn:hover { background: #5b54e8; }

  /* Loading */
  .loading {
    text-align: center;
    padding: 60px;
    color: var(--muted);
    font-size: 15px;
  }

  .spinner {
    width: 40px;
    height: 40px;
    border: 3px solid var(--border);
    border-top-color: var(--accent);
    border-radius: 50%;
    animation: spin 0.8s linear infinite;
    margin: 0 auto 16px;
  }

  @keyframes spin { to { transform: rotate(360deg); } }

  /* Count badge */
  .count-badge {
    font-size: 13px;
    color: var(--muted);
    padding: 0 48px;
    margin-bottom: 16px;
  }
</style>
</head>
<body>

<header>
  <div class="logo">📺 Media Hub <span>TV Panel</span></div>
  <div class="live-dot">Live Sync</div>
</header>

<div class="filters">
  <button class="filter-btn active" onclick="filterItems('all', this)">🌐 All</button>
  <button class="filter-btn" onclick="filterItems('pdf', this)">📄 PDFs</button>
  <button class="filter-btn" onclick="filterItems('image', this)">🖼️ Images</button>
  <button class="filter-btn" onclick="filterItems('video', this)">🎬 Videos</button>
  <button class="filter-btn" onclick="filterItems('audio', this)">🎵 Audio</button>
  <button class="filter-btn" onclick="filterItems('link', this)">🔗 Links</button>
</div>

<div class="count-badge" id="countBadge"></div>

<div class="grid" id="grid">
  <div class="loading">
    <div class="spinner"></div>
    Loading...
  </div>
</div>

<!-- Modal -->
<div class="modal-overlay" id="modalOverlay" onclick="closeModal(event)">
  <div class="modal">
    <div class="modal-header">
      <h2 id="modalTitle">Title</h2>
      <button class="modal-close" onclick="closeModal()">✕</button>
    </div>
    <div class="modal-body" id="modalBody"></div>
  </div>
</div>

<script type="module">
  import { createClient } from 'https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/+esm';

  const SUPABASE_URL = 'https://apibpgwficxocziaoebq.supabase.co';
  const SUPABASE_ANON = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImFwaWJwZ3dmaWN4b2N6aWFvZWJxIiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTEyNjcwODMsImV4cCI6MjEwNjg0MzA4M30.Qu0_zVq3yh1xmM9_tXhzBtMGAWFJ6Mi_BySwdkcMzeI';

  const sb = createClient(SUPABASE_URL, SUPABASE_ANON);

  let allItems = [];
  let currentFilter = 'all';

  const icons = { pdf: '📄', image: '🖼️', video: '🎬', audio: '🎵', link: '🔗' };

  async function loadItems() {
    const { data, error } = await sb
      .from('media_items')
      .select('*')
      .order('created_at', { ascending: false });

    if (error) { console.error(error); return; }
    allItems = data;
    renderGrid();
  }

  function renderGrid() {
    const grid = document.getElementById('grid');
    const badge = document.getElementById('countBadge');

    const filtered = currentFilter === 'all'
      ? allItems
      : allItems.filter(i => i.type === currentFilter);

    badge.textContent = `${filtered.length} item${filtered.length !== 1 ? 's' : ''}`;

    if (!filtered.length) {
      grid.innerHTML = `
        <div class="empty">
          <span class="empty-icon">📭</span>
          <h3>Kuch nahi hai yahan</h3>
          <p>Mobile se add karo, yahan automatically aa jayega!</p>
        </div>`;
      return;
    }

    grid.innerHTML = filtered.map(item => {
      const isImage = item.type === 'image';
      return `
        <div class="card" onclick="openItem(${JSON.stringify(item).replace(/"/g, '&quot;')})">
          <div class="card-thumb ${item.type}">
            ${isImage ? `<img src="${item.url}" alt="${item.title}" onerror="this.style.display='none'">` : ''}
            ${!isImage ? icons[item.type] || '📁' : ''}
          </div>
          <div class="card-body">
            <div class="card-type ${item.type}">${item.type}</div>
            <div class="card-title">${item.title}</div>
            <div class="card-date">${new Date(item.created_at).toLocaleDateString('en-IN', { day: 'numeric', month: 'short', year: 'numeric' })}</div>
          </div>
        </div>`;
    }).join('');
  }

  window.filterItems = (type, btn) => {
    currentFilter = type;
    document.querySelectorAll('.filter-btn').forEach(b => b.classList.remove('active'));
    btn.classList.add('active');
    renderGrid();
  };

  window.openItem = (item) => {
    const overlay = document.getElementById('modalOverlay');
    const body = document.getElementById('modalBody');
    document.getElementById('modalTitle').textContent = item.title;

    if (item.type === 'pdf') {
      body.innerHTML = `<iframe src="https://mozilla.github.io/pdf.js/web/viewer.html?file=${encodeURIComponent(item.url)}"></iframe>`;
    } else if (item.type === 'image') {
      body.innerHTML = `<img src="${item.url}" alt="${item.title}">`;
    } else if (item.type === 'video') {
      body.innerHTML = `<video controls autoplay><source src="${item.url}"><p>Video nahi chal raha.</p></video>`;
    } else if (item.type === 'audio') {
      body.innerHTML = `<audio controls autoplay style="width:100%"><source src="${item.url}"><p>Audio nahi chal raha.</p></audio>`;
    } else if (item.type === 'link') {
      body.innerHTML = `
        <div style="text-align:center">
          <div style="font-size:48px;margin-bottom:16px">🔗</div>
          <p style="color:var(--muted);margin-bottom:24px;font-size:15px">${item.url}</p>
          <a href="${item.url}" target="_blank" class="open-link-btn">Open Link ↗</a>
        </div>`;
    }

    overlay.classList.add('open');
  };

  window.closeModal = (e) => {
    if (e && e.target !== document.getElementById('modalOverlay')) return;
    const overlay = document.getElementById('modalOverlay');
    overlay.classList.remove('open');
    document.getElementById('modalBody').innerHTML = '';
  };

  // Real-time
  sb.channel('tv_media')
    .on('postgres_changes', { event: '*', schema: 'public', table: 'media_items' }, () => loadItems())
    .subscribe();

  // Keyboard close
  document.addEventListener('keydown', e => {
    if (e.key === 'Escape') {
      document.getElementById('modalOverlay').classList.remove('open');
      document.getElementById('modalBody').innerHTML = '';
    }
  });

  loadItems();
</script>
</body>
</html>
